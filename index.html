<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="game-wrapper">
        <div class="header">
          <img src="img/water-can-transparent.png" alt="Company Logo" class="logo"/>
          <h1 class="game-title">Water Drop</h1>
        </div>

        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <div class="difficulty-select">
              <h3>Difficulty:</h3>
              <select id="difficulty-select">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>

            <button id="start-btn">Start Game</button>
        </div>


        <div id="game-container">
        </div>

    </div>
    <footer class="custom-footer">
          <nav class="footer-nav">
            <a class="custom-footer-link" href="https://www.charitywater.org/take-action">Take Action</a>
            <a class="custom-footer-link" href="https://www.charitywater.org/about?_gl=1*wy5lp*_up*MQ..*_gs*MQ..&gclid=CjwKCAjw0sfHBhB6EiwAQtv5qXx9NFqtIPZXSEd5nXbBEjFFKoU4537CeaK22TuA5TaR2HDyoKbMEBoCNWkQAvD_BwE&gbraid=0AAAAADNj5D_Ok16dEzsn9XAnB9iJj0QA3">About us</a>
            <a class="custom-footer-link" href="https://www.charitywater.org/global-water-crisis">Why Water</a>
            <a class="custom-footer-link" href="https://www.charitywater.org/?utm_source=adwords&utm_medium=paid-ppc&utm_campaign=spring-acq-usrow&utm_term=cBC_CW_G_PAID_SEARCH_BRAND_ALL_US+ROW_OBSV_ALL_PHRASE_ALL&utm_content=branded&gad_source=1&gad_campaignid=22148602074&gbraid=0AAAAADNj5D_Ok16dEzsn9XAnB9iJj0QA3&gclid=CjwKCAjw0sfHBhB6EiwAQtv5qXx9NFqtIPZXSEd5nXbBEjFFKoU4537CeaK22TuA5TaR2HDyoKbMEBoCNWkQAvD_BwE">Donate</a>
          </nav>
          <p>&copy; 2025 Charity: water. All rights reserved.</p>
    
      </footer>
    
    <script src="script.js"></script>
</body>
</html>
